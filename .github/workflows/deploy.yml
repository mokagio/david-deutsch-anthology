name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Set up Ruby # will read Ruby version from .ruby-version
        uses: ruby/setup-ruby@v1
      - name: Run tests
        run: rake test
      - name: Generate static pages
        run: ruby bin/generate_html.rb
      - name: Generate podcast feed
        # Builds from list.yml alone. Resolving here reached a dozen third-party
        # hosts on every deploy, never once found anything, and was the only way
        # left for a blocked host to quietly shrink the feed.
        run: ruby bin/generate_podcast_rss.rb --no-resolve
      - name: Validate podcast feed
        run: ruby bin/validate_podcast_rss.rb
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
